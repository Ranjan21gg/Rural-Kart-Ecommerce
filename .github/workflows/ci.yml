name: Rural-Kart CI

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

jobs:
  backend-check:
    name: Backend Check
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ruralkart
          POSTGRES_USER: ruralkart_user
          POSTGRES_PASSWORD: ruralkart_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ruralkart_user -d ruralkart"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Django system checks
        env:
          SECRET_KEY: ci-test-secret-key
          DEBUG: "True"

          DB_NAME: ruralkart
          DB_USER: ruralkart_user
          DB_PASSWORD: ruralkart_ci_password
          DB_HOST: localhost
          DB_PORT: 5432

        run: uv run python manage.py check

      - name: Run migrations
        env:
          SECRET_KEY: ci-test-secret-key
          DEBUG: "True"

          DB_NAME: ruralkart
          DB_USER: ruralkart_user
          DB_PASSWORD: ruralkart_ci_password
          DB_HOST: localhost
          DB_PORT: 5432

        run: uv run python manage.py migrate --noinput

      - name: Build backend Docker image
        run: docker build -t rural-kart-backend .

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
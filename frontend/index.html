<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <title>RuralKart | Shop Authentic Rural & Handcrafted Products</title>
    <meta
      name="description"
      content="RuralKart connects you with authentic rural, handcrafted, traditional and eco-friendly products from local artisans and rural sellers across India."
    />
    <meta name="robots" content="index, follow" />

    <!-- Canonical -->
    <link
      rel="canonical"
      href="https://rural-kart-ecommerce.vercel.app/"
    />

    <!-- Theme -->
    <meta name="theme-color" content="#0ea5e9" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="RuralKart | Authentic Rural & Handcrafted Products"
    />
    <meta
      property="og:description"
      content="Discover authentic rural, handcrafted and traditional products from local artisans and rural sellers across India."
    />
    <meta
      property="og:url"
      content="https://rural-kart-ecommerce.vercel.app/"
    />
    <meta
      property="og:image"
      content="https://rural-kart-ecommerce.vercel.app/og-image.png"
    />
    <meta
      property="og:image:alt"
      content="RuralKart - Authentic Rural & Handcrafted Products"
    />
    <meta property="og:site_name" content="RuralKart" />
    <meta property="og:locale" content="en_IN" />

  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
